# Existing reviewed tag only. Evidence E is fetched as blobs by source C;
# no code, actions or policy from E are checked out (Constitution IV/VIII).
name: release

on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [prepare, promote]
        required: true
      version:
        description: Existing version tag, vMAJOR.MINOR.PATCH
        type: string
        required: true
      source:
        description: Exact reviewed 40-character source commit C
        type: string
        required: true
      evidence_commit:
        description: Same-repository immutable evidence commit E; promotion only
        type: string
      artifact_id:
        description: Immutable preparation artifact ID; promotion only
        type: string
      prepare_run_id:
        description: Preparation workflow run ID; promotion only
        type: string
      prepare_run_attempt:
        description: Preparation workflow run attempt; promotion only
        type: string

permissions:
  contents: read

concurrency:
  group: stargate-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      inputs.phase == 'prepare' && github.repository == 'zcat-app/stargate' &&
      startsWith(github.ref, 'refs/tags/') && github.sha == inputs.source &&
      github.ref_name == inputs.version
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Install byte-verified preparation tools
        run: python3 scripts/release.py install-tools --purpose prepare
      - name: Verify and retain candidate
        env:
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/release.py prepare --source "$SOURCE" --version "$VERSION" --output "$PWD/target/release-prepared"
      - name: Retain exact candidate and all OCI blobs
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stargate-${{ inputs.version }}-${{ inputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release-prepared/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
      - name: Artifact identity receipt
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          printf 'Preparation artifact ID: %s\n\nArchive SHA256: %s\n\nRun: %s / attempt %s\n' \
            "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"

  pack:
    if: >-
      inputs.phase == 'promote' && github.repository == 'zcat-app/stargate' &&
      startsWith(github.ref, 'refs/tags/') && github.sha == inputs.source &&
      github.ref_name == inputs.version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      pack_sha256: ${{ steps.pack.outputs.pack_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
      - name: Install byte-verified validation tools
        run: python3 scripts/release.py install-tools --purpose validate
      - name: Validate evidence and prepare exact approval pack
        id: pack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ inputs.version }}
          EVIDENCE: ${{ inputs.evidence_commit }}
          ARTIFACT: ${{ inputs.artifact_id }}
          PREPARE_RUN: ${{ inputs.prepare_run_id }}
          PREPARE_ATTEMPT: ${{ inputs.prepare_run_attempt }}
        run: |
          python3 scripts/release.py promotion-pack --source "$SOURCE" --version "$VERSION" \
            --evidence-commit "$EVIDENCE" --artifact-id "$ARTIFACT" \
            --prepare-run-id "$PREPARE_RUN" --prepare-run-attempt "$PREPARE_ATTEMPT" --output target/approval-pack.json
          printf 'pack_sha256=%s\n' "$(sha256sum target/approval-pack.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approval-pack-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/approval-pack.json
          if-no-files-found: error
          retention-days: 14

  promote:
    needs: pack
    if: >-
      inputs.phase == 'promote' && github.repository == 'zcat-app/stargate' &&
      startsWith(github.ref, 'refs/tags/') && github.sha == inputs.source &&
      github.ref_name == inputs.version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: stargate-release
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
      - name: Install byte-verified promotion tools
        run: python3 scripts/release.py install-tools --purpose promote
      - name: Reconstruct approved pack and publish verified retained bytes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ inputs.version }}
          EVIDENCE: ${{ inputs.evidence_commit }}
          ARTIFACT: ${{ inputs.artifact_id }}
          PREPARE_RUN: ${{ inputs.prepare_run_id }}
          PREPARE_ATTEMPT: ${{ inputs.prepare_run_attempt }}
          PACK_SHA256: ${{ needs.pack.outputs.pack_sha256 }}
        run: |
          python3 scripts/release.py promote --source "$SOURCE" --version "$VERSION" \
            --evidence-commit "$EVIDENCE" --artifact-id "$ARTIFACT" \
            --prepare-run-id "$PREPARE_RUN" --prepare-run-attempt "$PREPARE_ATTEMPT" --pack-sha256 "$PACK_SHA256"
