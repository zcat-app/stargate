#
# Composite action: install the stargate toolchain (Go, JDK 25, Python 3)
# for use by CI workflows. Deduped from verify.yml + agent-task.yml so the
# two stay in sync.
#
# Mirrors what scripts/verify.sh self-detects at runtime; here we install
# every tool upfront so the gates exercise for real rather than SKIP.

name: Set up stargate toolchain
description: Install Go (from data-plane/go.mod), JDK 25 (Temurin), and Python 3.

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: data-plane/go.mod
        cache-dependency-path: data-plane/go.sum

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
        cache: maven

    - name: Set up Python 3
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
