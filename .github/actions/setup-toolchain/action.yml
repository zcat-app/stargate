#
# Composite action: install the stargate toolchain (Go, JDK 25, Python 3,
# Node 20) for use by CI workflows. Deduped from verify.yml + agent-task.yml
# so the two stay in sync.
#
# Mirrors what scripts/verify.sh self-detects at runtime; here we install
# every tool upfront so the gates exercise for real rather than SKIP.
#
# T191 item 4 (Constitution IV): every toolchain resolves to an exact
# version, so two runs of one commit use the same tools. Go is pinned to
# data-plane/go.mod's `toolchain` directive (this action's go-version-file
# would read only `go 1.26` and take the newest patch; ci_inputs_test.sh
# keeps the two equal). No
# cross-run cache is restored: a cache saved by any run on the default
# branch (including the auto-approving agent-task run) would otherwise feed
# its module, build or Maven bytes into every later verify run.

name: Set up stargate toolchain
description: Install exact Go 1.26.3, Temurin JDK 25.0.4+7, Python 3.12.15 and Node 20.20.2, with no cross-run caches.

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.26.3'
        cache: false

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: '25.0.4+7'

    - name: Set up Python 3
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12.15'

    # Node 20 LTS is the CI pin for the extension JS unit tests
    # (extension/run-tests.sh, verify.sh Gate 2b) — research.md §10.
    - name: Set up Node 20
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20.20.2'
