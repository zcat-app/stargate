# T036 test-profile wiring for the persistence module: the @QuarkusTest suite
# boots the same production shape the runtime module will (Agroal SQLite +
# Hibernate/Panache + Flyway). This file lives in src/test/resources only —
# production datasource config arrives with the runtime module (T041).
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:target/stargate-cp-test.db
# Deterministic dialect: quarkus-jdbc-sqlite ships the community dialect;
# pinning it keeps the test boot independent of auto-detection ordering.
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
# Flyway owns the schema (V001__init.sql); Hibernate must never emit DDL
# (its test-profile default is `update`, which would mask schema drift).
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
# audit_log's append-only triggers forbid cleanup deletes, so instead of
# delta-only fixtures accumulating across runs FOREVER, clean the schema at
# each test boot; tests still use delta assertions within a run.
quarkus.flyway.clean-at-start=true
quarkus.flyway.clean-disabled=false
