# control-plane/runtime — production configuration (T041).
#
# The runtime module boots the aggregated app (api / core / persistence / ui)
# via StargateControlPlane's @QuarkusMain. The persistence shape is the T036
# test wiring promoted to production: Agroal SQLite + Hibernate ORM + Flyway
# owning the schema (V001__init.sql lands configured_tokens + token_generation
# at boot — the T092 (c) seed/migrate).

# Control-plane SQLite state (plan.md; arch §5.4: named volume
# stargate-control-state mounts /var/lib/stargate).
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:/var/lib/stargate/control.db
# Deterministic dialect: quarkus-jdbc-sqlite ships the community dialect;
# pinning it keeps the boot independent of auto-detection ordering.
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
# Flyway owns the schema (V001__init.sql); Hibernate must never emit DDL.
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

# Boot topology consumed by StargateControlPlane (compose contract):
# tokens.yaml from stargate-control-config (FR-017), the pepper + inter-plane
# keypairs from stargate-keys (§1.7 / wire-auth §6), both UDS sockets on the
# stargate-ipc volume (control-grpc §"Socket topology"), and the Tor
# authenticated observer health socket on the CP-only fabric (T138/T164).
stargate.tokens-path=/etc/stargate/tokens.yaml
stargate.pepper-path=/etc/stargate/keys/pepper.key
stargate.keys-dir=/etc/stargate/keys
stargate.control-sock=/run/stargate/control.sock
stargate.dp-sock=/run/stargate/dp.sock
stargate.tor-observer-sock=/run/stargate-tor-observer/health.sock
stargate.monitor-poll=PT10S
