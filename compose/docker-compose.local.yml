#
# T162 Local topology. The DP shares the host network namespace so its strict
# 127.0.0.1 bind is the browser-facing listener. Host owner-match rules and a
# DP AppArmor profile must be installed before this stack starts; see
# scripts/stargate init and THREAT-MODEL.md §3.1. Tor alone has bridge egress.
# T168 also requires Landlock ABI >= 4 and seccomp TSYNC in the static Go DP.
# It installs process confinement before serving; owner rules are defense in depth.
# The CP observer fabric is reserved for T164; CP has no Tor cookie or raw
# control socket during this transition.

services:
  stargate-dp:
    build:
      context: ..
      dockerfile: data-plane/Dockerfile
    image: stargate/stargate-dp:local
    user: "5102:5100"
    group_add:
      - "5200"
    network_mode: host
    environment:
      STARGATE_LISTEN_ADDR: "127.0.0.1:8881"
      STARGATE_TOR_SOCKS_ADDR: "unix:///run/stargate-tor/tor-socks.sock"
    volumes:
      - stargate-ipc:/run/stargate
      - stargate-keys:/etc/stargate/keys:ro
      - stargate-dp-state:/var/lib/stargate
      - stargate-tor-dp-fabric:/run/stargate-tor:ro
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor=stargate-dp
    mem_limit: 512m
    pids_limit: 256
    restart: "no"

  stargate-control:
    build:
      context: ..
      dockerfile: control-plane/Dockerfile
    image: stargate/stargate-control:local
    user: "5101:5100"
    network_mode: none
    volumes:
      - stargate-ipc:/run/stargate
      - stargate-keys:/etc/stargate/keys
      - stargate-control-config:/etc/stargate:ro
      - stargate-control-state:/var/lib/stargate
      - stargate-tor-config:/etc/tor
      - stargate-tor-cp-fabric:/run/stargate-tor-observer:ro
    read_only: true
    tmpfs:
      # sqlite-jdbc maps its extracted native library with PROT_EXEC here.
      - /tmp:rw,exec
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 512
    restart: unless-stopped

  tor:
    build:
      context: ../sidecars/tor
      dockerfile: Dockerfile
    image: stargate/tor:local
    group_add:
      - "5200"
    volumes:
      - stargate-tor-state:/var/lib/tor
      - stargate-tor-dp-fabric:/run/tor-fabric
    networks:
      - stargate-egress
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped

networks:
  stargate-egress:
    driver: bridge

volumes:
  stargate-keys:
  stargate-ipc:
  stargate-control-config:
  stargate-control-state:
  stargate-dp-state:
  stargate-tor-state:
  stargate-tor-config:
  stargate-tor-dp-fabric:
  stargate-tor-cp-fabric:
