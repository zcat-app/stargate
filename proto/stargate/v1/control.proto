// Control surface hosted by the data plane on /run/stargate/dp.sock.
//
// In v1 (Tor-route feature) this declares only the subset of the
// stargate.v1 surface this feature exercises. The full surface is
// defined in ARCHITECTURE.md §5; the per-RPC contract this proto
// must mirror is specs/001-tor-route/contracts/control-grpc.md
// §"ReloadTokens" and §"GetStatus (minimum subset)".
//
// GetStatus ships in v1 (rather than deferring with its production
// caller to the admin-UI feature) so the contract-test harness in
// T025c, T025d, and T067b can probe the FR-008 counter contract
// without forcing a stargate.v2 vocabulary bump later. Trade-off
// rationale: plan.md tension #10 / research.md §11.
//
// Amended by T092 (sol-review B5+M1): the bearer-token verifier is an
// HMAC-SHA-256 tag under a shared install-time pepper, not an Argon2id
// hash. `TokenHash` is renamed `TokenVerifier` and its `salt` field is
// DROPPED (single shared pepper → no per-token salt); the response gains
// `current_generation` for stale-CP reconciliation. This is a breaking
// pre-release contract change recorded as an amendment NOTE in
// SECURITY-DECISIONS.md (NOT a stargate.v2 bump; no consumers today).
// See specs/001-tor-route/data-model.md §1 and §1.5.
//
// KNOWN DRIFT (intentional, T092 scope boundary): this .proto SOURCE is the
// contract of record and is amended here; the GENERATED stubs
// (`grpcpb/control.pb.go`) and the T020 contract tests still reference the
// retired `TokenHash { hash; salt }` shape. Regenerating the stubs and
// remediating the T020 tests is a HARD GATE owned by T093 acceptance #6
// (blocked_by T092; `remediates: T020`) — the T020 tests are content-gated
// to SKIP today, so the tree stays green with the stale stubs in place. T092
// does not regenerate stubs or rewrite test logic (that would break the green
// gate mid-amendment and pre-empt T093's test-first role). T093 is not done
// until the drift is resolved (no `TokenHash`/`salt` reference remains in the
// regenerated `grpcpb` package or the T020 test), not merely documented.

syntax = "proto3";

package stargate.v1;

option go_package = "github.com/zcat-app/stargate/proto/stargate/v1/grpcpb";

service Control {
  // CP -> DP: atomically swap the bearer-token hash set. See
  // contracts/control-grpc.md §"ReloadTokens" for generation
  // and persistence semantics.
  rpc ReloadTokens(ReloadTokensRequest) returns (ReloadTokensResponse);

  // Test-harness -> DP: read a point-in-time snapshot of the
  // (route, hour_bucket) -> (request_count, byte_count) aggregates.
  // Production CP caller is deferred to the admin-UI feature; in v1
  // the only callers are tests/contract/socks5/{auth_failure_counter,
  // auth_passed_counter,route_failure_counter}_test.go.
  rpc GetStatus(StatusRequest) returns (StatusResponse);
}

// --- ReloadTokens --------------------------------------------------

message ReloadTokensRequest {
  uint64 generation = 1;              // monotonic; CP proposal = persisted last + 1
  repeated TokenVerifier tokens = 2;
}

// T092: HMAC-SHA-256 tag under the install-time pepper. No per-token salt
// (single shared pepper). Renamed from TokenHash; the old `salt` field is
// dropped (breaking pre-release change; see file header + SECURITY-DECISIONS.md).
message TokenVerifier {
  bytes verifier = 1;                 // 32 bytes (HMAC-SHA-256 tag)
}

message ReloadTokensResponse {
  uint64 applied_generation = 1;
  ApplyStatus status = 2;
  uint64 current_generation = 3;      // T092: DP's current generation; set on STALE so the CP can retry with current + 1
}

enum ApplyStatus {
  APPLY_STATUS_UNSPECIFIED = 0;
  APPLY_STATUS_OK = 1;
  APPLY_STATUS_STALE_GENERATION = 2; // request.generation <= current
  APPLY_STATUS_INVALID = 3;          // malformed verifier / wrong length
}

// --- GetStatus (minimum subset) ------------------------------------

message StatusRequest {}

message StatusResponse {
  repeated RouteCounter counters = 1;
}

message RouteCounter {
  string route        = 1;   // "TOR" in this feature; later sidecars add their own labels
  uint64 hour_bucket  = 2;   // unix-hour bucket per data-model.md §3
  uint64 request_count = 3;
  uint64 byte_count   = 4;
}
