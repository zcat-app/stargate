// Control surface hosted by the data plane on /run/stargate/dp.sock.
//
// In v1 (Tor-route feature) this declares only the subset of the
// stargate.v1 surface this feature exercises. The full surface is
// defined in ARCHITECTURE.md §5; the per-RPC contract this proto
// must mirror is specs/001-tor-route/contracts/control-grpc.md
// §"ReloadTokens" and §"GetStatus (minimum subset)".
//
// GetStatus ships in v1 (rather than deferring with its production
// caller to the admin-UI feature) so the contract-test harness in
// T025c, T025d, and T067b can probe the FR-008 counter contract
// without forcing a stargate.v2 vocabulary bump later. Trade-off
// rationale: plan.md tension #10 / research.md §11.

syntax = "proto3";

package stargate.v1;

option go_package = "github.com/zcat-app/stargate/data-plane/grpcpb";

service Control {
  // CP -> DP: atomically swap the bearer-token hash set. See
  // contracts/control-grpc.md §"ReloadTokens" for generation
  // and persistence semantics.
  rpc ReloadTokens(ReloadTokensRequest) returns (ReloadTokensResponse);

  // Test-harness -> DP: read a point-in-time snapshot of the
  // (route, hour_bucket) -> (request_count, byte_count) aggregates.
  // Production CP caller is deferred to the admin-UI feature; in v1
  // the only callers are tests/contract/socks5/{auth_failure_counter,
  // auth_passed_counter,route_failure_counter}_test.go.
  rpc GetStatus(StatusRequest) returns (StatusResponse);
}

// --- ReloadTokens --------------------------------------------------

message ReloadTokensRequest {
  uint64 generation = 1;              // monotonic
  repeated TokenHash tokens = 2;
}

message TokenHash {
  bytes hash = 1;                     // 32 bytes (argon2id output)
  bytes salt = 2;                     // 16 bytes
}

message ReloadTokensResponse {
  uint64 applied_generation = 1;
  ApplyStatus status = 2;
}

enum ApplyStatus {
  APPLY_STATUS_UNSPECIFIED = 0;
  APPLY_STATUS_OK = 1;
  APPLY_STATUS_STALE_GENERATION = 2; // request.generation <= current
  APPLY_STATUS_INVALID = 3;          // malformed hash / wrong length
}

// --- GetStatus (minimum subset) ------------------------------------

message StatusRequest {}

message StatusResponse {
  repeated RouteCounter counters = 1;
}

message RouteCounter {
  string route        = 1;   // "TOR" in this feature; later sidecars add their own labels
  uint64 hour_bucket  = 2;   // unix-hour bucket per data-model.md §3
  uint64 request_count = 3;
  uint64 byte_count   = 4;
}
