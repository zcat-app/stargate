#
# gitleaks configuration for Stargate.
#
# Why: the pre-commit secret scanner (.githooks/pre-commit) prefers gitleaks
# when installed. gitleaks' default ruleset flags the illustrative example
# bearer tokens in the spec docs (generic-api-key on `token: <32-hex>`),
# which would (a) noise up every history scan and (b) false-block legitimate
# doc commits via the pre-commit hook. This config keeps the FULL default
# ruleset and allowlists ONLY those two known placeholder values — a real
# token (any other value) is still caught, including in the same files.

title = "Stargate gitleaks config"

[extend]
# Inherit all of gitleaks' built-in rules; we only ADD an allowlist below.
useDefault = true

[[allowlists]]
description = "Documented example bearer tokens in 001-tor-route specs (placeholders, not real credentials — see data-model.md / quickstart.md)"
regexes = [
  '''9f2c3a14b8d7e60f5a3c2e1d0b9c8a7f''',
  '''1a2b3c4d5e6f70819a8b7c6d5e4f3a2b''',
]

[[allowlists]]
description = "Test-fixture bearer token in tests/integration/dns_leak_test.go (T034) — FR-017-compliant 32-char hex placeholder labelled 'test fixture only, never deployed'; the data plane accepts it only via the test-only STARGATE_TEST_TOKEN_PLAINTEXT env-var path owned by T050."
regexes = [
  '''0123456789abcdef0123456789abcdef''',
]

[[allowlists]]
description = "Java type-name false positive (T038): generic-api-key treats 'certificate' as a keyword and the JDK type name X509Certificate in CpTls.Identity's record header as its value. No credential material — the full declaration line is allowlisted (regexTarget=line) so any other occurrence still scans."
regexTarget = "line"
regexes = [
  '''public record Identity\(PrivateKey privateKey, X509Certificate certificate\) \{''',
]
